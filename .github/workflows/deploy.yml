name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The résumé PDF is kept out of git (it contains a phone number) and
      # lives as an asset on the "resume" release instead.
      - name: Fetch résumé PDF
        run: gh release download resume --pattern jigar-panchal-resume.pdf --dir public
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
