<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate: npm run og -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: 'Inter Variable'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background-color: #0b0d10;
    background-image: radial-gradient(ellipse 70% 60% at 50% -10%, rgba(94,234,212,.12), transparent 70%), radial-gradient(circle at 1px 1px, rgba(255,255,255,.10) 1px, transparent 0);
    background-size: 100% 100%, 24px 24px;
    color: #e6e8eb;
    font-family: 'Inter Variable', -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px; box-sizing: border-box;
  }
  .logo { font-size: 32px; font-weight: 700; letter-spacing: -0.01em; } .logo span { color: #5eead4; }
  h1 { font-size: 76px; line-height: 1.05; letter-spacing: -0.035em; margin: 0; max-width: 900px; font-weight: 700; }
  h1 span { color: #5eead4; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: #9aa3ae; }
  .pill { display: inline-flex; align-items: center; gap: 12px; border: 1px solid #134e4a; background: #042f2e; color: #a7f3d0; padding: 10px 20px; border-radius: 999px; font-size: 22px; }

</style></head>
<body>
  <div class="logo">Jigar Panchal<span>.</span></div>
  <h1>Backend engineer who makes <span>slow systems fast</span>.</h1>
  <div class="foot"><span>Senior Software Engineer · Any stack</span><span class="pill">Open to interesting work</span></div>
</body></html>
